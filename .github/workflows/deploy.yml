name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # configure-pages turns Pages on
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # configure-pages with enablement flips the repo's Pages source to
      # "GitHub Actions" automatically, so no manual Settings toggle is needed.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Install exactly what the lockfile names. It was written on the work pc, whose registry github cannot reach,
      # so the addresses are pointed at npm's own; the integrity hashes beside them still have to match.
      - name: Install from the lockfile
        run: |
          sed -i 's#https://artifactory.epic.com/artifactory/api/npm/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          # Optional repo secret for the Microsoft To Do sign-in. Can also be left
          # unset; the app still works without it.
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
