name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Same as the Pages build: the Windows lockfile mis-resolves native deps on Linux.
      - run: rm -f package-lock.json && npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build:android
        env:
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID }}
      # Every build is signed with the same key, so a new apk installs over the last one and keeps the app's data.
      - name: Build apk
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/my-brain.p12"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          else
            echo "::warning::No signing key in the repo secrets. This apk will not install over an earlier one."
          fi
          chmod +x gradlew
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
          rm -f "$RUNNER_TEMP/my-brain.p12"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/my-brain.apk"
      # One release, replaced on every build, so the phone always downloads from the same address.
      - name: Publish apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --prerelease --title "android app" --notes "The latest build of the phone app. Replaced on every push to main."
          gh release upload android "$RUNNER_TEMP/my-brain.apk" --clobber
