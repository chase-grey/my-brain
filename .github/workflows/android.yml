name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release the phone downloads from
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # Install exactly what the lockfile names. It was written on the work pc, whose registry github cannot reach,
      # so the addresses are pointed at npm's own; the integrity hashes beside them still have to match.
      - name: Install from the lockfile
        run: |
          sed -i 's#https://artifactory.epic.com/artifactory/api/npm/npm/#https://registry.npmjs.org/#g' package-lock.json
          npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build:android
        env:
          VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID }}
      # The installed app takes a new web part on its own, and asks for the apk only when the native part changed.
      # This fingerprint is how it tells: the android folder, the shell's config, and the capacitor packages that were installed.
      - name: Fingerprint the native part
        run: |
          stamp=$( {
            git rev-parse HEAD:android
            git hash-object capacitor.config.ts
            node -e "const fs=require('fs');for(const scope of ['@capacitor','@capacitor-community'])for(const name of fs.readdirSync('node_modules/'+scope).sort())if(name!=='cli')console.log(scope+'/'+name,require('./node_modules/'+scope+'/'+name+'/package.json').version)"
          } | sha256sum | cut -c1-12 )
          echo "NATIVE_STAMP=n$stamp" >> "$GITHUB_ENV"
          echo "WEB_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      # update.json is what the installed app reads. It names the web part, its hash, and this build's number, which
      # only goes up: the app takes nothing with a lower number than it has.
      - name: Pack the web part
        run: |
          cd dist && zip -qr "$RUNNER_TEMP/web-$WEB_COMMIT.zip" .
          hash=$(sha256sum "$RUNNER_TEMP/web-$WEB_COMMIT.zip" | cut -d' ' -f1)
          echo "{\"web\":\"$WEB_COMMIT\",\"native\":\"$NATIVE_STAMP\",\"sha256\":\"$hash\",\"build\":${{ github.run_number }}}" > "$RUNNER_TEMP/update.json"
      # Every build is signed with the same key, so a new apk installs over the last one and keeps the app's data.
      # The same key signs update.json, and the app checks that against its own certificate before it takes a web part.
      - name: Build the apk and sign update.json
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/my-brain.p12"
            trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          else
            echo "::warning::No signing key in the repo secrets. This apk will not install over an earlier one, and it will take no web updates."
          fi
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }} -PnativeStamp="$NATIVE_STAMP"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/my-brain.apk"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            java ../scripts/SignUpdate.java "$ANDROID_KEYSTORE_FILE" "$RUNNER_TEMP/update.json" "$RUNNER_TEMP/update.json.sig" > "$RUNNER_TEMP/signer.txt"
          fi
      # Nothing is published unless the apk is a release build, carries the certificate update.json was signed with,
      # and carries the same one as the apk already out, so it installs over it.
      - name: Check the apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          certificate() { "$tools/apksigner" verify --print-certs "$1" | grep -m1 'certificate SHA-256 digest' | sed 's/.*: //'; }
          if "$tools/aapt2" dump badging "$RUNNER_TEMP/my-brain.apk" | grep -q application-debuggable; then
            echo "::error::The apk can be debugged."; exit 1
          fi
          [ -f "$RUNNER_TEMP/update.json.sig" ] || exit 0
          new=$(certificate "$RUNNER_TEMP/my-brain.apk")
          if [ -z "$new" ] || [ "$new" != "$(cat "$RUNNER_TEMP/signer.txt")" ]; then
            echo "::error::The apk does not carry the certificate update.json was signed with."; exit 1
          fi
          if gh release download android --repo "$GITHUB_REPOSITORY" --pattern my-brain.apk --dir "$RUNNER_TEMP/published" 2>/dev/null; then
            if [ "$new" != "$(certificate "$RUNNER_TEMP/published/my-brain.apk")" ]; then
              echo "::error::The apk is signed with a different key from the one published, so it would not install over it."; exit 1
            fi
            echo "Same certificate as the published apk."
          else
            echo "::warning::Could not download the published apk to compare certificates."
          fi
      # One release, replaced on every build, so the phone always downloads from the same address.
      # update.json and its signature go up last: they are what the installed app reads, and what they name has to be there already.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GH_REPO="$GITHUB_REPOSITORY"
          gh release view android >/dev/null 2>&1 || gh release create android --prerelease --title "android app" --notes "The latest build of the phone app. Replaced on every push to main."
          gh release upload android "$RUNNER_TEMP/my-brain.apk" "$RUNNER_TEMP/web-$WEB_COMMIT.zip" --clobber
          signature="$RUNNER_TEMP/update.json.sig"
          gh release upload android $( [ -f "$signature" ] && echo "$signature" ) "$RUNNER_TEMP/update.json" --clobber
          for old in $(gh release view android --json assets -q '.assets[].name' | grep '^web-' | grep -v "^web-$WEB_COMMIT.zip$" || true); do
            gh release delete-asset android "$old" -y
          done
